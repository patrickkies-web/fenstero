<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>h12 · Alles drin · Auch rund und schräg.</title>
<link rel="stylesheet" href="../vorlage/vorlage.css">
<style>
  /* screen-lokal: Raster 3 × 3 aus echten 3-D-Modellen, je Kachel nur die Modellfläche (Aufnahme 358 × 164 CSS-px, Faktor 3),
     Beschriftung darunter; das Raster füllt die Höhe bis zur Fußzeile (Kachel etwa 293 × 134) */
  .ef-inhalt { flex: 1 1 auto }
  .h-raster { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 24px 16px }
  .h-kachel { display: flex; flex-direction: column; gap: 10px; min-height: 0 }
  .h-kachel > .ef-ausschnitt { flex: 1 1 0; min-height: 0; border-radius: 24px }
  .h-kachel > .ef-ausschnitt > img { height: 100%; object-fit: cover; object-position: 50% 50% }
  .h-kachel > figcaption { flex: none; font-size: var(--ef-fs-chip); line-height: 1.2; font-weight: 700; color: var(--ef-text-2); white-space: nowrap }
</style>
</head>
<body>
<!-- Kapitel „Alles drin“, Inhalt (h12): Formen und Öffnung, je das echte 3-D-Modell der passenden Frage im Kundenlink (Fensterbau Brandt,
     Familie Weber), aufgenommen mit werkzeug/aufnahmen-alles-drin.mjs h12: K.fenster(page, 'fenster', …), K.frage(page, id), Modellfläche #w3d
     358 × 164, Kamera der Frage („inside“), ohne Schwingen und ohne Beschriftungspille, alle neun im selben Maßstab (s = 0,088 px je mm).
     Formen: Frage „form“ („Welche Form? Antippen zeigt die Form am Modell.“, Frage 10 von 26), Rund 1.200 × 1.200 mm fest verglast;
     Stulp und 3 Flügel: Frage „teilung“; Oberlicht kippbar: Frage „ol“; Unterlicht Glas 450 mm: Frage „ul“; Dreh-Kipp gekippt: Frage „typ-0“
     mit K.vorfuehren { i: 0, t: 650 } (grüner Rahmen = markierter Flügel der App, Linien = Öffnungssymbol).
     Belege: web/assets/modell.js:15 form; web/assets/app.js:2340; werkzeug/berichte/kunde.md Auswahlwerte teilung, din, ol, ul, Sprossen;
     modell.js:59 TYP Fest, Dreh, Kipp, Dreh-Kipp. -->
<main class="ef-buehne">
  <header class="ef-kopf">
    <span class="ef-wortmarke">eeziframes</span>
    <span class="ef-label">Alles drin · 3/4</span>
  </header>
  <div class="ef-inhalt">
    <div class="ef-text">
      <p class="ef-kicker">Form und Öffnung</p>
      <h2 class="ef-display">Auch rund<br>und <span class="ef-gruen">schräg.</span></h2>
      <p class="ef-lead">Rundbogen, Segmentbogen, Schräg und Rund. Dazu Stulp, Oberlicht, Unterlicht und Sprossen.</p>
      <ul class="ef-chips">
        <li class="ef-chip">1 bis 3 Flügel</li>
        <li class="ef-chip">Dreh, Kipp, Dreh-Kipp</li>
        <li class="ef-chip">DIN links oder rechts</li>
      </ul>
    </div>
    <div class="h-raster">
      <figure class="h-kachel"><div class="ef-ausschnitt"><img src="../aufnahmen/h12-rundbogen.png" alt="3-D-Modell: Fenster mit Rundbogen, zwei Flügel."></div><figcaption>Rundbogen</figcaption></figure>
      <figure class="h-kachel"><div class="ef-ausschnitt"><img src="../aufnahmen/h12-segment.png" alt="3-D-Modell: Fenster mit Segmentbogen."></div><figcaption>Segmentbogen</figcaption></figure>
      <figure class="h-kachel"><div class="ef-ausschnitt"><img src="../aufnahmen/h12-schraeg.png" alt="3-D-Modell: Fenster mit schräger Oberkante."></div><figcaption>Schräg</figcaption></figure>
      <figure class="h-kachel"><div class="ef-ausschnitt"><img src="../aufnahmen/h12-rund.png" alt="3-D-Modell: rundes Fenster, fest verglast."></div><figcaption>Rund</figcaption></figure>
      <figure class="h-kachel"><div class="ef-ausschnitt"><img src="../aufnahmen/h12-stulp.png" alt="3-D-Modell: zwei Flügel mit Stulp, ohne Pfosten."></div><figcaption>Stulp</figcaption></figure>
      <figure class="h-kachel"><div class="ef-ausschnitt"><img src="../aufnahmen/h12-drei.png" alt="3-D-Modell: Fenster mit 3 Flügeln, die Mitte fest."></div><figcaption>3 Flügel</figcaption></figure>
      <figure class="h-kachel"><div class="ef-ausschnitt"><img src="../aufnahmen/h12-oberlicht.png" alt="3-D-Modell: Fenster mit Oberlicht."></div><figcaption>Oberlicht</figcaption></figure>
      <figure class="h-kachel"><div class="ef-ausschnitt"><img src="../aufnahmen/h12-unterlicht.png" alt="3-D-Modell: Fenster mit Unterlicht aus Glas."></div><figcaption>Unterlicht</figcaption></figure>
      <figure class="h-kachel"><div class="ef-ausschnitt"><img src="../aufnahmen/h12-kipp.png" alt="3-D-Modell: Dreh-Kipp-Flügel gekippt, mit Öffnungssymbol."></div><figcaption>Dreh-Kipp gekippt</figcaption></figure>
    </div>
  </div>
  <footer class="ef-fuss">
    <ol class="ef-punkte" aria-label="Screen 3 von 4">
      <li class="ef-fertig"></li><li class="ef-fertig"></li><li class="ef-jetzt"></li><li></li>
    </ol>
    <span class="ef-fuss-text">eeziframes.com</span>
  </footer>
</main>
</body>
</html>
