<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>h03 · Link · In 4 Klicks bereit.</title>
<link rel="stylesheet" href="../vorlage/vorlage.css">
<style>
  /* Ersatz ohne Foto: Solange bilder/h03-foto.* fehlt, zeigt der Slot das Link-Icon (aufnahmen/h03-ersatz-link.svg) statt des Bärenfotos,
     das schon h01 trägt. Das Icon steht links auf der Inhaltskante, unter der oberen Sicherheitszone, ohne Ausblendung.
     Liegt das KI-Foto vor, greift die Regel nicht mehr (Endung .png, .jpg oder .webp) und der Foto-Kopf erscheint wie gewohnt. */
  .ef-foto > img[src$=".svg"] { position: absolute; left: var(--ef-pad-x); bottom: 64px; width: 400px; height: 400px; object-fit: contain; -webkit-mask-image: none; mask-image: none }
</style>
</head>
<body>
<!-- Kapitel Link, Cover (h03). Foto-Slot h03-foto: neues KI-Foto (Motiv in storyboard.json) als bilder/h03-foto.(png|jpg|webp) ablegen und neu
     rendern, mehr ist nicht nötig. Bis dahin rendert render.mjs den Ersatz aufnahmen/h03-ersatz-link.svg, damit das Bärenfoto aus h01 nicht
     ein zweites Mal erscheint (Bär = Fensterbauer, ein Waschbär-Foto passt hier nicht). Text nur auf dem dunklen Grund.
     Zählung: Klick 1 Neues Projekt, Eingabe Name, Klick 2 Weiter, Klick 3 Projekt anlegen, Klick 4 WhatsApp (portal.js). Ohne Handynummer
     öffnet WhatsApp danach die Kontaktauswahl (portal.js:758), deshalb „bereit“ und nicht „raus“. -->
<main class="ef-buehne ef-buehne--foto">
  <figure class="ef-foto" style="--ef-fp: 50% 0%">
    <img data-slot="h03-foto" data-ersatz="../aufnahmen/h03-ersatz-link.svg" src="../aufnahmen/h03-ersatz-link.svg" alt="Bär in Arbeitskleidung tippt in seiner Werkstatt auf dem Smartphone.">
  </figure>
  <header class="ef-kopf">
    <span class="ef-wortmarke">eeziframes</span>
    <span class="ef-label">Link · 1/4</span>
  </header>
  <div class="ef-text">
    <p class="ef-kicker">Teil 2 von 6 · Der Link</p>
    <h1 class="ef-display-xl">In 4<br>Klicks<br><span class="ef-gruen">bereit.</span></h1>
    <p class="ef-lead">Projekt anlegen, Namen eintragen, WhatsApp öffnen. Dort Kontakt wählen und senden.</p>
    <ul class="ef-chips">
      <li class="ef-chip">4 Klicks</li>
      <li class="ef-chip">1 Eingabe</li>
      <li class="ef-chip">WhatsApp, SMS, E-Mail</li>
    </ul>
  </div>
</main>
</body>
</html>
