<!-- h10 Cover Kapitel „Alles drin“ (1/4). Foto randlos oben, weich in #161616 auslaufend, Text erst auf dem dunklen Grund darunter.
     Foto-Slot h10-foto: liegt bilder/h10-foto.(png|jpg|webp) vor, nimmt render.mjs diese Datei, sonst das Ersatzfoto
     bilder/waschbaeren-sofa.webp (= web/bilder/foto/app-start.webp, 1120 × 1400). Besetzung: Waschbär = Hauseigentümer, Kunde.
     Belege: web/assets/modell.js:24 OPT.art (6 Elementarten), modell.js:15 OPT.form (5 Formen);
     werkzeug/berichte/kunde.md „Wie viele Schritte und Fragen“ (Fenster mit 2 Flügeln 26 Fragen, mit bedingten Zusatzfragen bis 29;
     erkundung/kunde-sonne-aussen.png „Frage 20 von 29“); alle Fragen vorbelegt, Pflicht ist nur der Name; jede Frage dreht das Modell
     in die passende Ansicht (app.js SCREENS.frage: model(w, { view: q.view … })). docs/BILDER.md:32 app-start. -->
<main class="ef-buehne ef-buehne--foto">
  <figure class="ef-foto" style="--ef-fp: 50% 18%">
    <img data-slot="h10-foto" data-ersatz="waschbaeren-sofa.webp" src="../bilder/waschbaeren-sofa.webp" alt="Drei Waschbären im Wohnzimmer: einer fotografiert die Maueröffnung samt Zollstock, einer tippt auf dem Sofa seine Wünsche ins Handy, einer lehnt sich zurück.">
  </figure>
  <header class="ef-kopf">
    <span class="ef-wortmarke">eeziframes</span>
    <span class="ef-label">Alles drin · 1/4</span>
  </header>
  <div class="ef-text">
    <p class="ef-kicker">Teil 4 von 6 · Alles drin</p>
    <h1 class="ef-display-xl">Bis ins<br><span class="ef-gruen">Detail.</span></h1>
    <p class="ef-lead">6 Elementarten, 5 Formen, dazu Öffnung,<br>Farbe, Glas und Sonnenschutz.<br>Alles am <span style="white-space: nowrap">3-D-Modell.</span></p>
    <ul class="ef-chips">
      <li class="ef-chip">Bis 29 Fragen je Element</li>
      <li class="ef-chip">Alle vorbelegt</li>
      <li class="ef-chip">Am 3-D-Modell</li>
    </ul>
  </div>
</main>
</body>
