<!-- h09 Inhalt Kapitel „Kunde misst“ (3/3): zwei echte Ausschnitte aus „Ränder fertig“ der Kunden-App (Link Fensterbau Brandt, Familie Weber).
     Aufnahmen: aufnahmen/h09-modell.png (#w3d mit allen sechs Maßlinien der Öffnung und „Alle Ränder gemessen“) und aufnahmen/h09-hinweis.png
     (Hinweis „bis zu 25 mm außer Winkel“), erzeugt mit werkzeug/aufnahmen-kunde.mjs (echte Klicks über die Zifferntasten, Telefon 390 × 844, Faktor 3).
     Messwerte: Öffnung Mitte 2.000 × 1.260, Höhe rechts 1.235 (25 mm), Breite unten 1.994; Fenster 1.965 × 1.225.
     Belege: web/assets/portal.js:453 (CAPS: drei Breiten und drei Höhen, das kleinste Maß zählt, außer Winkel markiert),
     web/assets/app.js:473-478 (derive: kleinstes von drei Maßen), app.js:1906 (Hinweis ab 10 mm), app.js:635 (Warnung ab 60 mm),
     app.js:605-616 (MESS und REST: 4 Maße mit Zifferntasten plus 4 Ränder = 8 Maße), werkzeug/berichte/kunde.md Ablauf 4 bis 6 (Maßlinie wächst im Modell mit).

     Chip „cm statt mm wird erkannt“ (statt „3-D-Modell wächst mit“): web/assets/app.js:621 und 633 („Meintest du … cm? Das wären … mm.“, bei Eingaben

     Weitere Prüfungen, nicht im Chip: Element größer als die Öffnung (app.js:625), Rand weicht mehr als 60 mm vom Mittelmaß ab (app.js:635).
