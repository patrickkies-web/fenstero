<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Muster Abschluss (h20)</title>
<link rel="stylesheet" href="vorlage.css">
</head>
<body>
<!-- Muster Abschluss: Kopfzeile, Textblock, eine Karte (echter Ausschnitt), Fußzeile mit der einzigen Cream-Fläche.
     Der Ausschnitt ist ein Probebild aus werkzeug/erkundung (Tarif Start, ohne Knopf); für den echten Screen neu aufnehmen. -->
<main class="ef-buehne">
  <header class="ef-kopf">
    <span class="ef-wortmarke">eeziframes</span>
    <span class="ef-label">Preise · 2/2</span>
  </header>
  <div class="ef-inhalt">
    <div class="ef-text">
      <p class="ef-kicker">Für Fensterbauer</p>
      <h2 class="ef-display"><span class="ef-gruen">Link</span> statt<br>Anfahrt.</h2>
      <p class="ef-lead">Testen Sie mit Ihren nächsten 3 Kunden. Ohne Grundgebühr und ohne Zahlungsart.</p>
    </div>
    <figure class="ef-ausschnitt"><img src="muster-bilder/muster-tarif-start.png" alt="Tarif Start: 0 Euro Grundgebühr, 3 Projekte kostenlos, danach 9 Euro je Projekt mit eingegangenem Aufmaß."></figure>
  </div>
  <footer class="ef-fuss">
    <span class="ef-cta">Kostenlos starten<span class="ef-pf"></span></span>
    <span class="ef-fuss-text ef-fuss-text--hell">eeziframes.com</span>
  </footer>
</main>
</body>
</html>
