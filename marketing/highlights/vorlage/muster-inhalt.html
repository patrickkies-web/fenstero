<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Muster Inhalt (h04)</title>
<link rel="stylesheet" href="vorlage.css">
</head>
<body>
<!-- Muster Inhalt: Kopfzeile, Klick-Badge, Textblock (display 128px, 2 Zeilen), Chips,
     echte Ausschnitte als Karten mit Marken links (.ef-schritte), Fußzeile mit Fortschritt.
     Die Ausschnitte hier sind Probebilder aus werkzeug/erkundung; für den echten Screen neu aufnehmen. -->
<main class="ef-buehne">
  <header class="ef-kopf">
    <span class="ef-wortmarke">eeziframes</span>
    <span class="ef-label">Link · 2/4</span>
  </header>
  <div class="ef-inhalt">
    <div class="ef-text">
      <span class="ef-klick">Klick 1 bis 2 von 4</span>
      <p class="ef-kicker">Projekt anlegen</p>
      <h2 class="ef-display">Ein Name<br><span class="ef-gruen">genügt.</span></h2>
      <p class="ef-lead">Pflicht ist nur der Name. Adresse, Gebäude und Fensterzahl sind freiwillig.</p>
      <ul class="ef-chips">
        <li class="ef-chip">Eckdaten freiwillig</li>
        <li class="ef-chip">Sie oder Du</li>
      </ul>
    </div>
    <div class="ef-schritte">
      <span class="ef-marke">1</span>
      <figure class="ef-ausschnitt ef-ausschnitt--grund"><img src="muster-bilder/muster-neues-projekt.png" alt="Knopf Neues Projekt in der Projektliste."></figure>
      <span class="ef-marke ef-marke--wort">Eingabe</span>
      <figure class="ef-ausschnitt"><img src="muster-bilder/muster-name.png" alt="Feld Name des Kunden mit Familie Neumann."></figure>
      <span class="ef-marke">2</span>
      <figure class="ef-ausschnitt"><img src="muster-bilder/muster-weiter.png" alt="Knöpfe Abbrechen und Weiter."></figure>
    </div>
  </div>
  <footer class="ef-fuss">
    <ol class="ef-punkte" aria-label="Screen 2 von 4">
      <li class="ef-fertig"></li><li class="ef-jetzt"></li><li></li><li></li>
    </ol>
    <span class="ef-fuss-text">eeziframes.com</span>
  </footer>
</main>
</body>
</html>
