<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Muster Telefon (h08)</title>
<link rel="stylesheet" href="vorlage.css">
</head>
<body>
<!-- Zusatzmuster Inhalt mit Telefonrahmen: echte App-Aufnahme im Rahmen links, Haken-Liste rechts (.ef-split).
     Breite über --ef-tel-b; die Aufnahme vorher passend zuschneiden (hier: Schritt 2 bis „Passt.“).
     Probebild aus werkzeug/erkundung; für den echten Screen neu aufnehmen. -->
<main class="ef-buehne">
  <header class="ef-kopf">
    <span class="ef-wortmarke">eeziframes</span>
    <span class="ef-label">Kunde misst · 2/3</span>
  </header>
  <div class="ef-inhalt">
    <div class="ef-text">
      <p class="ef-kicker">Fotos innen und außen</p>
      <h2 class="ef-display">Zwei <span class="ef-gruen">Fotos</span><br>je Fenster.</h2>
      <p class="ef-lead">Von innen und von außen. Die KI liest daraus Rollladenkasten, Anschlag, Fensterbänke und Fassade.</p>
    </div>
    <div class="ef-split">
      <figure class="ef-telefon" style="--ef-tel-b: 450px"><img src="muster-bilder/muster-fotos.png" alt="Kunden-App, Schritt 2 Fotos: Von innen und Von außen mit KI fertig."></figure>
      <ul class="ef-haken">
        <li>Je 1 Foto innen und außen</li>
        <li>Wasserwaage im Bild</li>
        <li>Maße gegen Foto geprüft</li>
      </ul>
    </div>
  </div>
  <footer class="ef-fuss">
    <ol class="ef-punkte" aria-label="Screen 2 von 3">
      <li class="ef-fertig"></li><li class="ef-jetzt"></li><li></li>
    </ol>
    <span class="ef-fuss-text">eeziframes.com</span>
  </footer>
</main>
</body>
</html>
