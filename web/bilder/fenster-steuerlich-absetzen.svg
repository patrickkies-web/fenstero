<title id="t">Zuschuss oder Steuerbonus bei 20.000 € für neue Fenster (Beispiel)</title>
<desc id="d">Beispiel mit 20.000 Euro Kosten für neue Fenster. Links der BAFA-Zuschuss: ein Balken, 15 Prozent, 3.000 Euro auf einmal. Rechts der Steuerbonus nach Paragraf 35c: drei Balken über drei Jahre, 7, 7 und 6 Prozent, also 1.400, 1.400 und 1.200 Euro, zusammen 4.000 Euro.</desc>
