<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 372" width="480" height="372" role="img" aria-labelledby="t d"><style id="schrift">@font-face{font-family:"Outfit";font-weight:400 699;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Outfit";font-weight:700 900;src:url(data:font/woff2;base64,) format("woff2")}</style>
<title id="t">Digitales Aufmaß: wie genau Laser, LiDAR und Foto messen</title>
<desc id="d">Balken je Verfahren auf einer Skala von 0 bis 20 Millimetern: Laser-Entfernungsmesser plus minus 1,5 mm, LiDAR im Handy plus minus 10 mm, Foto mit einem A4-Blatt als Maßstab plus minus 10 bis 20 mm. Eine gestrichelte Linie markiert die erlaubte Abweichung einer Fensteröffnung von 1 bis 3 m nach DIN 18202: plus minus 12 mm.</desc>
<rect width="480" height="372" rx="16" fill="#ffffff"/>
<g stroke="#d2d0d3" stroke-width="1.5"><line x1="260" y1="32" x2="260" y2="262"/><line x1="320" y1="32" x2="320" y2="262"/><line x1="380" y1="32" x2="380" y2="262"/><line x1="440" y1="32" x2="440" y2="262"/></g>
<path d="M200 44H214a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H200Z" fill="#897efc"/>
<path d="M200 116H316a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H200Z" fill="#897efc"/>
<path d="M200 188H320V216H200Z" fill="#897efc"/>
<path d="M321 189H436a3 3 0 0 1 3 3v22a3 3 0 0 1-3 3H321Z" fill="#eceef1" stroke="#897efc" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="200" y1="32" x2="200" y2="262" stroke="#07090a" stroke-width="1.5"/>
<line x1="200" y1="262" x2="440" y2="262" stroke="#07090a" stroke-width="1.5"/>
<line x1="344" y1="28" x2="344" y2="262" stroke="#f88962" stroke-width="3" stroke-dasharray="7 5"/>
<g font-family="Outfit, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#07090a">
<text x="24" y="54" font-weight="700">Laser</text>
<text x="24" y="78" fill="#6b676c">± 1,5 mm</text>
<text x="24" y="126" font-weight="700">LiDAR im Handy</text>
<text x="24" y="150" fill="#6b676c">± 10 mm</text>
<text x="24" y="198" font-weight="700">Foto mit A4-Blatt</text>
<text x="24" y="222" fill="#6b676c">± 10 bis 20 mm</text>
<g fill="#6b676c" text-anchor="middle"><text x="200" y="288">0</text><text x="260" y="288">5</text><text x="320" y="288">10</text><text x="380" y="288">15</text><text x="440" y="288">20 mm</text></g>
<line x1="24" y1="338" x2="56" y2="338" stroke="#f88962" stroke-width="3" stroke-dasharray="7 5"/>
<text x="68" y="344" fill="#b4502f" font-weight="700">Öffnung 1 bis 3 m darf ± 12 mm abweichen</text>
</g>
