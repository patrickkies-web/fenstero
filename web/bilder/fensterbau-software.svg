<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 392" width="480" height="392" role="img" aria-labelledby="t d"><style id="schrift">@font-face{font-family:"Outfit";font-weight:400 699;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Outfit";font-weight:700 900;src:url(data:font/woff2;base64,) format("woff2")}</style>
<title id="t">Fensterbau-Software: woher die Maße kommen und wohin sie gehen</title>
<desc id="d">Oben zwei Wege zum Aufmaß: eine Aufmaß-App, mit der der Betrieb vor Ort per Laser, Foto oder Skizze misst, und das Selbstaufmaß, bei dem der Kunde per Link mit dem Zollstock misst. Unten die Software, die mit den Maßen weiterarbeitet: Handwerkersoftware für Angebot, Auftrag und Rechnung, Branchensoftware oder ERP für Kalkulation, Konstruktion und Fertigung.</desc>
