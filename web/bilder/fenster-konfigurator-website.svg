<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 392" width="480" height="392" role="img" aria-labelledby="t d"><style id="schrift">@font-face{font-family:"Outfit";font-weight:400 699;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Outfit";font-weight:700 900;src:url(data:font/woff2;base64,) format("woff2")}</style>
<title id="t">Fenster-Konfigurator auf der Website: der Weg einer Anfrage</title>
<desc id="d">Oben Ihre Website mit dem Knopf „Fenster planen“. Ein Klick führt zu Ihrem Konfigurator, in dem der Kunde misst, fotografiert und wählt. Die Anfrage geht als Aufmaßblatt mit Maßen, Fotos und Wünschen in Ihr Postfach; gestrichelt daneben die Frage, ob sie auch an andere Betriebe geht.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#07090a"/></marker></defs>
<rect width="480" height="392" rx="16" fill="#ffffff"/>
<g stroke-width="3">
<rect x="16" y="16" width="448" height="92" rx="10" fill="#ecebec" stroke="#f88962"/>
<rect x="16" y="140" width="448" height="92" rx="10" fill="#ecebec" stroke="#f88962"/>
<rect x="16" y="272" width="280" height="104" rx="10" fill="#eceef1" stroke="#897efc"/>
</g>
<rect x="312" y="272" width="152" height="104" rx="10" fill="#f6f6f7" stroke="#a8a4a9" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="292" y="40" width="152" height="44" rx="22" fill="#897efc"/>
<g stroke="#07090a" stroke-width="2" marker-end="url(#p)">
<line x1="240" y1="109" x2="240" y2="138"/>
<line x1="156" y1="233" x2="156" y2="270"/>
</g>
<line x1="388" y1="233" x2="388" y2="270" stroke="#a8a4a9" stroke-width="2" stroke-dasharray="5 4"/>
<g font-family="Outfit, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#07090a">
<text x="36" y="54" font-size="20" font-weight="700" fill="#b4502f">Ihre Website</text>
<text x="36" y="84">ein Knopf genügt</text>
<text x="368" y="68" font-weight="700" text-anchor="middle">Fenster planen</text>
<text x="252" y="130">1 Klick</text>
<text x="36" y="178" font-size="20" font-weight="700" fill="#b4502f">Ihr Konfigurator</text>
<text x="36" y="208">Kunde misst, fotografiert, wählt</text>
<text x="36" y="310" font-size="20" font-weight="700" fill="#3c3a66">Ihr Postfach</text>
<text x="36" y="338">Aufmaßblatt mit Maßen,</text>
<text x="36" y="362">Fotos und Wünschen</text>
<text x="388" y="318" text-anchor="middle" fill="#6b676c">andere</text>
<text x="388" y="344" text-anchor="middle" fill="#6b676c">Betriebe?</text>
</g>
</svg>
