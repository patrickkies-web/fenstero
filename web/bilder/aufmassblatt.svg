<rect x="52" y="96" width="176" height="160" fill="none" stroke="#c2410c" stroke-width="3"/>
<rect x="64" y="108" width="152" height="136" fill="#dceaf7" stroke="#1d4ed8" stroke-width="2.5"/>
<line x1="140" y1="108" x2="140" y2="244" stroke="#1d4ed8" stroke-width="2.5"/>
<rect x="258" y="96" width="174" height="72" rx="6" fill="#ecebe6"/>
<rect x="258" y="184" width="174" height="72" rx="6" fill="#ecebe6"/>
