<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 384" width="480" height="384" role="img" aria-labelledby="t d">
<title id="t">Vom Erstaufmaß über das Feinaufmaß zum Bestellmaß</title>
<desc id="d">Drei Stufen untereinander: Erstaufmaß fürs Angebot, gemessen vom Kunden per Link oder vom Betrieb; Feinaufmaß vor der Bestellung, gemessen vom Fensterbauer vor Ort; Bestellmaß für die Fertigung, Feinaufmaß minus Fuge. Von oben nach unten wird es genauer und verbindlicher.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#141414"/></marker></defs>
<rect width="480" height="384" rx="16" fill="#ffffff"/>
<g stroke-width="3">
<rect x="16" y="16" width="448" height="84" rx="10" fill="#ecebe6" stroke="#c2410c"/>
<rect x="16" y="128" width="448" height="84" rx="10" fill="#ecebe6" stroke="#c2410c"/>
<rect x="16" y="240" width="448" height="84" rx="10" fill="#dceaf7" stroke="#1d4ed8"/>
</g>
<g stroke="#141414" stroke-width="2" marker-end="url(#p)">
<line x1="240" y1="101" x2="240" y2="126"/><line x1="240" y1="213" x2="240" y2="238"/>
</g>
<g font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#141414">
<text x="36" y="50" font-size="20" font-weight="700" fill="#c2410c">Erstaufmaß</text>
<text x="36" y="80">fürs Angebot: Kunde per Link oder Betrieb</text>
<text x="36" y="162" font-size="20" font-weight="700" fill="#c2410c">Feinaufmaß</text>
<text x="36" y="192">vor der Bestellung: Fensterbauer vor Ort</text>
<text x="36" y="274" font-size="20" font-weight="700" fill="#1d4ed8">Bestellmaß</text>
<text x="36" y="304">für die Fertigung: Feinaufmaß minus Fuge</text>
<text x="240" y="362" text-anchor="middle">von oben nach unten: genauer, verbindlicher</text>
</g>
</svg>
