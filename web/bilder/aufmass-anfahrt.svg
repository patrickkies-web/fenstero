<title id="t">Aufmaß vor Ort oder per Link: wie viele Fahrten bis zum Auftrag</title>
<desc id="d">Oben das Aufmaß vor Ort: eine Fahrt fürs Erstaufmaß, solange der Auftrag offen ist, und eine zweite Fahrt fürs Feinaufmaß nach dem Auftrag. Unten das Aufmaß per Link: Der Kunde misst selbst fürs Angebot, gefahren wird nur zum Feinaufmaß nach dem Auftrag.</desc>
