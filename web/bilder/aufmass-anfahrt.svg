<line x1="36" y1="308" x2="398" y2="308" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="8 6"/>
<rect x="410" y="282" width="22" height="38" rx="4" fill="#dceaf7" stroke="#1d4ed8" stroke-width="2"/><line x1="417" y1="314" x2="425" y2="314" stroke="#1d4ed8" stroke-width="2"/>
<line x1="36" y1="366" x2="394" y2="366" stroke="#c2410c" stroke-width="3" marker-end="url(#o)"/>
<path d="M402 376V358L421 342L440 358V376Z" fill="#ecebe6" stroke="#141414" stroke-width="2" stroke-linejoin="round"/><rect x="415" y="364" width="12" height="12" fill="#ffffff" stroke="#141414" stroke-width="1.5"/>
<g font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#141414">
<text x="36" y="52" font-weight="700" fill="#c2410c">Aufmaß vor Ort: zwei Fahrten</text>
<text x="36" y="252" font-weight="700" fill="#1d4ed8">Aufmaß per Link: eine Fahrt</text>
<text x="36" y="88">1 · Erstaufmaß, Auftrag offen</text>
<text x="36" y="146">2 · Feinaufmaß nach Auftrag</text>
<text x="36" y="288">1 · Kunde misst selbst</text>
<text x="36" y="346">2 · Feinaufmaß nach Auftrag</text>
</g>
</svg>
