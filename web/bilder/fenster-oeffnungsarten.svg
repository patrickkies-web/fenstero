<title id="t">Fenster-Öffnungsarten mit ihren Symbolen, Ansicht von innen</title>
<desc id="d">Sechs Fenster: Dreh-Kipp mit Bändern links und Kipplinien, Dreh nur mit Drehlinien, Kipp nur mit Kipplinien und Griff oben, Festverglasung ohne Symbol, zwei Flügel mit Stulp ohne Mittelpfosten und zwei Flügel mit festem Pfosten. Die Linien beginnen an der Bandseite, die Spitze zeigt zum Griff.</desc>
