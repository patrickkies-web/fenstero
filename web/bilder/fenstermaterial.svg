<rect x="84" y="66" width="70" height="8" fill="#dceaf7" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="84" y="86" width="70" height="8" fill="#dceaf7" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="20" y="146" font-weight="700">Holz</text>
</g>
<!-- Holz-Alu -->
<g transform="translate(24 208)">
<rect width="204" height="160" rx="10" fill="#f6f5f1"/>
<rect x="20" y="22" width="64" height="96" fill="#efe4d2" stroke="#141414" stroke-width="2"/>
<path d="M30 30C42 50 32 80 46 110M56 28C66 54 56 84 68 112" stroke="#141414" stroke-width="1" stroke-opacity=".45" fill="none"/>
