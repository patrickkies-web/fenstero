<rect x="84" y="46" width="70" height="8" fill="#dceaf7" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="84" y="66" width="70" height="8" fill="#dceaf7" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="84" y="86" width="70" height="8" fill="#dceaf7" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="20" y="146" font-weight="700">Holz-Alu</text>
</g>
<!-- Aluminium -->
<g transform="translate(252 208)">
<rect width="204" height="160" rx="10" fill="#f6f5f1"/>
<rect x="20" y="22" width="26" height="96" fill="#b9bcc2" stroke="#141414" stroke-width="2"/>
