<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-labelledby="t d">
<title id="t">Vier Rahmenmaterialien im Schnitt</title>
<desc id="d">Schnitte durch vier Fensterrahmen mit Glas: Kunststoff mit mehreren Kammern, Holz, Holz-Alu mit einer Aluminiumschale außen und Aluminium. Darunter je die wichtigste Eigenschaft.</desc>
<rect width="480" height="400" rx="16" fill="#ffffff"/>
<g font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#141414">
<!-- Kunststoff -->
<g transform="translate(24 24)">
<rect width="204" height="160" rx="10" fill="#f6f5f1"/>
<rect x="20" y="22" width="64" height="96" fill="#ffffff" stroke="#141414" stroke-width="2"/>
<path d="M41 22V118M62 22V118M20 54H84M20 86H84" stroke="#141414" stroke-width="1.5" fill="none"/>
<rect x="84" y="46" width="70" height="8" fill="#dceaf7" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="84" y="66" width="70" height="8" fill="#dceaf7" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="84" y="86" width="70" height="8" fill="#dceaf7" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="20" y="146" font-weight="700">Kunststoff</text>
</g>
<!-- Holz -->
