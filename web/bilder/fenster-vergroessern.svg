<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-labelledby="t d"><style id="schrift">@font-face{font-family:"Outfit";font-weight:400 699;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Outfit";font-weight:700 900;src:url(data:font/woff2;base64,) format("woff2")}</style>
<title id="t">Fenster vergrößern: heute und geplant</title>
<desc id="d">Wandansicht von innen in zwei Bildern. Links heute: ein kleines Fenster mit Brüstung darunter, die Brüstungshöhe als Maßlinie. Rechts geplant: eine breitere, bodentiefe Öffnung als Strichlinie um die Lage des alten Fensters, darin das neue Fenster. Darüber ein neuer, längerer Sturz, den ein Statiker rechnet. Unten ist die Brüstung weggenommen; dort stellt sich die Frage nach der Absturzsicherung.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#07090a"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#f88962"/></marker></defs>
