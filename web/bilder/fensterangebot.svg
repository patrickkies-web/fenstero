<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" width="480" height="460" role="img" aria-labelledby="t d"><style id="schrift">@font-face{font-family:"Outfit";font-weight:400 699;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Outfit";font-weight:700 900;src:url(data:font/woff2;base64,) format("woff2")}</style>
<title id="t">Was in ein Fensterangebot gehört</title>
<desc id="d">Ein Angebot für Fenster als Blatt mit fünf Teilen untereinander: Positionen mit Maß, Ausführung und Uw-Wert; Montage mit Ausbau, Fensterbank und Beiputzen; hervorgehoben der Feinaufmaß-Vorbehalt, nach dem die endgültigen Maße erst vor Ort festgelegt werden; die Bindefrist bis zu einem Datum; Zahlungsplan und Förderbedingung.</desc>
