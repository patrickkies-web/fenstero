<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="t d">
<title id="t">Fenster mit Rollladenkasten: was du misst</title>
<desc id="d">Drei Schnitte durch die Wand, innen links, außen rechts. Aufsatzkasten: Er sitzt auf dem Fenster und kommt mit heraus, gemessen wird bis zur Oberkante des Kastens. Einbaukasten: Er bleibt in der Wand, gemessen wird bis zur Unterkante des Kastens. Vorbaurollladen: Der Kasten sitzt außen, gemessen wird die Öffnung wie bei jedem Fenster.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#c2410c"/></marker></defs>
<rect width="480" height="330" rx="16" fill="#ffffff"/>
<g font-family="Helvetica Neue, Arial, sans-serif" fill="#141414">
<g>
<rect x="56" y="48" width="56" height="40" fill="#d6d5cf"/><rect x="56" y="240" width="56" height="44" fill="#d6d5cf"/>
<rect x="68" y="88" width="34" height="40" fill="#f3f2ee" stroke="#141414" stroke-width="2"/>
<rect x="74" y="128" width="22" height="112" fill="#dceaf7" stroke="#1d4ed8" stroke-width="3"/>
<line x1="38" y1="90" x2="38" y2="238" stroke="#c2410c" stroke-width="2.5" marker-start="url(#p)" marker-end="url(#p)"/>
<text x="84" y="314" text-anchor="middle" font-size="18" font-weight="700">Aufsatz</text>
</g>
<g transform="translate(160 0)">
<rect x="56" y="48" width="56" height="80" fill="#d6d5cf"/><rect x="56" y="240" width="56" height="44" fill="#d6d5cf"/>
<rect x="58" y="88" width="34" height="40" fill="#f3f2ee" stroke="#141414" stroke-width="2"/>
<rect x="74" y="128" width="22" height="112" fill="#dceaf7" stroke="#1d4ed8" stroke-width="3"/>
<line x1="38" y1="130" x2="38" y2="238" stroke="#c2410c" stroke-width="2.5" marker-start="url(#p)" marker-end="url(#p)"/>
<text x="84" y="314" text-anchor="middle" font-size="18" font-weight="700">Einbau</text>
</g>
<g transform="translate(320 0)">
<rect x="56" y="48" width="56" height="80" fill="#d6d5cf"/><rect x="56" y="240" width="56" height="44" fill="#d6d5cf"/>
<rect x="114" y="92" width="34" height="36" fill="#f3f2ee" stroke="#141414" stroke-width="2"/>
<rect x="74" y="128" width="22" height="112" fill="#dceaf7" stroke="#1d4ed8" stroke-width="3"/>
<line x1="38" y1="130" x2="38" y2="238" stroke="#c2410c" stroke-width="2.5" marker-start="url(#p)" marker-end="url(#p)"/>
<text x="84" y="314" text-anchor="middle" font-size="18" font-weight="700">Vorbau</text>
</g>
<text x="52" y="36" font-size="18" fill="#3d3d3a" text-anchor="end">innen</text><text x="116" y="36" font-size="18" fill="#3d3d3a">außen</text>
</g>
</svg>
