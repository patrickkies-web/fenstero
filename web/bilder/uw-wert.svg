<title id="t">Woraus der Uw-Wert eines Fensters entsteht</title>
<desc id="d">Ein Fenster von vorn: die Glasscheibe (Ug), der Rand der Scheibe mit dem Abstandhalter (Psi g) und der Rahmen (Uf). Zusammen ergeben sie den Uw-Wert des ganzen Fensters.</desc>
