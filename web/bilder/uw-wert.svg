<rect x="68" y="60" width="132" height="192" fill="none" stroke="#f88962" stroke-width="3" stroke-dasharray="8 5"/>
<g stroke="#07090a" stroke-width="1.5" fill="none">
<path d="M134 110H282"/><path d="M200 172H282"/><path d="M49 240V262H282"/>
</g>
<g fill="#07090a"><circle cx="134" cy="110" r="4"/><circle cx="200" cy="172" r="4"/><circle cx="49" cy="240" r="4"/></g>
<g font-family="Outfit, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#07090a">
<text x="292" y="104" font-weight="700" fill="#3c3a66">Glas</text>
<text x="292" y="128">U<tspan font-size="18" dy="5">g</tspan></text>
<text x="292" y="166" font-weight="700" fill="#b4502f">Glasrand</text>
<text x="292" y="190">Ψ<tspan font-size="18" dy="5">g</tspan><tspan dy="-5"> je Meter</tspan></text>
<text x="292" y="256" font-weight="700" fill="#3c3a66">Rahmen</text>
<text x="292" y="280">U<tspan font-size="18" dy="5">f</tspan></text>
<text x="240" y="326" text-anchor="middle" font-weight="700">Ganzes Fenster: U<tspan font-size="18" dy="5">w</tspan></text>
<text x="240" y="352" text-anchor="middle">je kleiner, desto weniger Wärmeverlust</text>
</g>
