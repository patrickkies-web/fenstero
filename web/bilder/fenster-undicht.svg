<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="t d">
<title id="t">Wo es am Fenster zieht</title>
<desc id="d">Fenster von innen in der Wand mit Rollladenkasten darüber. Markiert sind drei Stellen für Zugluft: 1 die Dichtung zwischen Flügel und Rahmen, 2 die Fuge zwischen Rahmen und Wand, 3 die Gurtöffnung am Rollladenkasten. Links ragt ein Blatt Papier für den Papiertest zwischen Flügel und Rahmen heraus.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#c2410c"/></marker></defs>
