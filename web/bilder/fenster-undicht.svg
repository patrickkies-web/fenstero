<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="t d"><style id="schrift">@font-face{font-family:"Outfit";font-weight:400 699;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Outfit";font-weight:700 900;src:url(data:font/woff2;base64,) format("woff2")}</style>
<title id="t">Wo es am Fenster zieht</title>
<desc id="d">Fenster von innen in der Wand mit Rollladenkasten darüber. Markiert sind drei Stellen für Zugluft: 1 die Dichtung zwischen Flügel und Rahmen, geprüft mit einem Blatt Papier, 2 die Fuge zwischen Rahmen und Wand, 3 die Gurtöffnung am Rollladenkasten.</desc>
