<rect x="50" y="60" width="190" height="244" fill="#ffffff" stroke="#f88962" stroke-width="3"/>
<rect x="50" y="60" width="190" height="38" fill="#e6e5e7" stroke="#07090a" stroke-width="1.5"/>
<rect x="196" y="94" width="16" height="8" fill="#07090a"/>
<rect x="58" y="104" width="174" height="194" fill="#eceef1" stroke="#897efc" stroke-width="3"/>
<rect x="72" y="118" width="146" height="166" fill="#eceef1" stroke="#897efc" stroke-width="3"/>
<rect x="86" y="132" width="118" height="138" fill="#f5f6f8" stroke="#897efc" stroke-width="1.5"/>
<rect x="207" y="192" width="6" height="26" rx="2" fill="#07090a"/>
<rect x="30" y="178" width="48" height="34" fill="#ffffff" stroke="#07090a" stroke-width="1.5" transform="rotate(-8 54 195)"/>
