<circle cx="156" cy="120" r="13" fill="#c2410c"/><text x="156" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
<circle cx="244" cy="250" r="13" fill="#c2410c"/><text x="244" y="256" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
<circle cx="221" cy="84" r="13" fill="#c2410c"/><text x="221" y="90" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
</g>
<g font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#141414">
<circle cx="318" cy="106" r="12" fill="#c2410c"/><text x="318" y="112" text-anchor="middle" font-weight="700" fill="#ffffff">1</text>
<text x="338" y="112" font-weight="700">Dichtung,</text><text x="338" y="134">Anpressdruck</text>
<circle cx="318" cy="190" r="12" fill="#c2410c"/><text x="318" y="196" text-anchor="middle" font-weight="700" fill="#ffffff">2</text>
<text x="338" y="196" font-weight="700">Fuge zwischen</text><text x="338" y="218">Rahmen und Wand</text>
<circle cx="318" cy="274" r="12" fill="#c2410c"/><text x="318" y="280" text-anchor="middle" font-weight="700" fill="#ffffff">3</text>
<text x="338" y="280" font-weight="700">Gurtöffnung am</text><text x="338" y="302">Rollladenkasten</text>
<text x="30" y="250" font-weight="700">Papiertest</text>
</g></svg>
