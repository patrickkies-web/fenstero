<circle cx="145" cy="118" r="13" fill="#f88962"/><text x="145" y="124">1</text>
<circle cx="232" cy="244" r="13" fill="#f88962"/><text x="232" y="250">2</text>
<circle cx="204" cy="80" r="13" fill="#f88962"/><text x="204" y="86">3</text>
</g><g font-family="Outfit, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#07090a">
<circle cx="294" cy="90" r="12" fill="#f88962"/><text x="294" y="96" text-anchor="middle" font-weight="700" fill="#07090a">1</text>
<text x="314" y="96" font-weight="700">Dichtung,</text><text x="314" y="118">Anpressdruck</text>
<circle cx="294" cy="190" r="12" fill="#f88962"/><text x="294" y="196" text-anchor="middle" font-weight="700" fill="#07090a">2</text>
<text x="314" y="196" font-weight="700">Fuge zwischen</text><text x="314" y="218">Rahmen und Wand</text>
<circle cx="294" cy="270" r="12" fill="#f88962"/><text x="294" y="276" text-anchor="middle" font-weight="700" fill="#07090a">3</text>
<text x="314" y="276" font-weight="700">Gurtöffnung am</text><text x="314" y="298">Rollladenkasten</text>
<text x="314" y="140">Papiertest</text>
</g></svg>
