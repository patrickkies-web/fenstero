<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" role="img" aria-labelledby="t d">
<title id="t">RAL-Montage: drei Ebenen in der Fuge zwischen Wand und Fenster</title>
<desc id="d">Schnitt durch den Sturz: oben die Wand, darunter das neue Fenster, dazwischen die Fuge. Außen ist die Fuge schlagregendicht abgedichtet, in der Mitte gedämmt, innen luftdicht. Grundsatz: innen dichter als außen.</desc>
<rect width="480" height="340" rx="16" fill="#ffffff"/>
<rect x="16" y="52" width="448" height="94" fill="#ecebe6"/>
<line x1="16" y1="146" x2="464" y2="146" stroke="#c2410c" stroke-width="3"/>
<rect x="190" y="147" width="14" height="23" fill="#6b7280"/>
<rect x="204" y="147" width="72" height="23" fill="#f6e3a1"/>
<rect x="276" y="147" width="14" height="23" fill="#141414"/>
<rect x="190" y="170" width="100" height="54" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
<rect x="226" y="224" width="28" height="84" fill="#dceaf7" stroke="#1d4ed8" stroke-width="2"/>
<g stroke="#141414" stroke-width="1.5" fill="none">
<path d="M196 160 L176 196"/><path d="M284 160 L304 196"/><path d="M240 156 L240 136"/>
</g>
<g font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#141414">
<text x="24" y="36" font-weight="700">außen</text>
<text x="456" y="36" text-anchor="end" font-weight="700">innen, Raum</text>
<text x="28" y="82" fill="#c2410c" font-weight="700">Wand (Sturz)</text>
<text x="240" y="128" text-anchor="middle">gedämmt</text>
<text x="172" y="214" text-anchor="end">schlagregendicht</text>
<text x="308" y="214">luftdicht</text>
<text x="266" y="282" fill="#1d4ed8" font-weight="700">neues Fenster</text>
<text x="240" y="328" text-anchor="middle" font-weight="700">innen dichter als außen</text>
</g>
</svg>
