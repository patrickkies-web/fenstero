<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" role="img" aria-labelledby="t d"><style id="schrift">@font-face{font-family:"Outfit";font-weight:400 699;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Outfit";font-weight:700 900;src:url(data:font/woff2;base64,) format("woff2")}</style>
<title id="t">RAL-Montage: drei Ebenen in der Fuge zwischen Wand und Fenster</title>
<desc id="d">Schnitt durch den Sturz: oben die Wand, darunter das neue Fenster, dazwischen die Fuge. Außen ist die Fuge schlagregendicht abgedichtet, in der Mitte gedämmt, innen luftdicht. Grundsatz: innen dichter als außen.</desc>
