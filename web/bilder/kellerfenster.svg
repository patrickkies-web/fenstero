<text x="36" y="60" font-weight="700">Keller</text>
<text x="444" y="60" text-anchor="end" font-weight="700">außen</text>
<text x="313" y="74" text-anchor="middle">Gitterrost</text>
<text x="36" y="160" fill="#1d4ed8" font-weight="700">Kellerfenster</text>
