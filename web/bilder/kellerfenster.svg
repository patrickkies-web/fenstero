<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 350" width="480" height="350" role="img" aria-labelledby="t d">
<title id="t">Kellerfenster mit Lichtschacht im Schnitt</title>
<desc id="d">Schnitt durch die Kellerwand: Das Kellerfenster (blau) sitzt in der Zarge oder Maueröffnung (orange) unter dem Gelände. Davor liegt außen der Lichtschacht mit Gitterrost oben. Gemessen werden die Öffnung, die Wandstärke und der Lichtschacht.</desc>
