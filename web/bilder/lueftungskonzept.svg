<g font-family="Outfit, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#07090a">
<text x="24" y="40" font-weight="700" fill="#3c3a66">Zuluft</text>
<text x="24" y="64">Lüfter im Fensterrahmen</text>
<text x="456" y="40" text-anchor="end" font-weight="700" fill="#b4502f">Abluft</text>
<text x="456" y="64" text-anchor="end">Ventilator im Bad</text>
<text x="150" y="128" text-anchor="middle">Wohnen</text>
<text x="360" y="200" text-anchor="middle">Bad</text>
<text x="260" y="226" text-anchor="end" font-size="18">Türspalt</text>
