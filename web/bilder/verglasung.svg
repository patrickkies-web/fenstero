<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" role="img" aria-labelledby="t d"><style id="schrift">@font-face{font-family:"Outfit";font-weight:400 699;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Outfit";font-weight:700 900;src:url(data:font/woff2;base64,) format("woff2")}</style>
<title id="t">Zweifach- und Dreifachverglasung im Schnitt</title>
<desc id="d">Links ein Isolierglas mit zwei Scheiben und einem Zwischenraum, rechts eines mit drei Scheiben und zwei Zwischenräumen. Darunter die typischen Werte: Ug 1,0 bis 1,1 und rund 20 kg je Quadratmeter gegen Ug 0,5 bis 0,7 und oft 30 kg je Quadratmeter.</desc>
<rect width="480" height="340" rx="16" fill="#ffffff"/>
<g font-family="Outfit, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#07090a">
<text x="120" y="40" text-anchor="middle" font-weight="700">Zweifach</text>
<text x="360" y="40" text-anchor="middle" font-weight="700">Dreifach</text>
<!-- Zweifach -->
<rect x="70" y="60" width="100" height="160" fill="#eceef1" fill-opacity=".45"/>
<rect x="70" y="60" width="8" height="160" fill="#eceef1" stroke="#897efc" stroke-width="2"/>
<rect x="162" y="60" width="8" height="160" fill="#eceef1" stroke="#897efc" stroke-width="2"/>
<rect x="78" y="204" width="84" height="16" fill="#07090a" fill-opacity=".75"/>
<rect x="78" y="60" width="84" height="16" fill="#07090a" fill-opacity=".75"/>
<!-- Dreifach -->
<rect x="302" y="60" width="116" height="160" fill="#eceef1" fill-opacity=".45"/>
<rect x="302" y="60" width="8" height="160" fill="#eceef1" stroke="#897efc" stroke-width="2"/>
<rect x="356" y="60" width="8" height="160" fill="#eceef1" stroke="#897efc" stroke-width="2"/>
<rect x="410" y="60" width="8" height="160" fill="#eceef1" stroke="#897efc" stroke-width="2"/>
<rect x="310" y="204" width="46" height="16" fill="#07090a" fill-opacity=".75"/>
<rect x="364" y="204" width="46" height="16" fill="#07090a" fill-opacity=".75"/>
<rect x="310" y="60" width="46" height="16" fill="#07090a" fill-opacity=".75"/>
<rect x="364" y="60" width="46" height="16" fill="#07090a" fill-opacity=".75"/>
<text x="120" y="256" text-anchor="middle">U<tspan font-size="18" dy="4">g</tspan><tspan dy="-4"> 1,0 bis 1,1</tspan></text>
<text x="120" y="284" text-anchor="middle">rund 20 kg/m²</text>
<text x="360" y="256" text-anchor="middle" fill="#3c3a66" font-weight="700">U<tspan dy="4">g</tspan><tspan dy="-4"> 0,5 bis 0,7</tspan></text>
<text x="360" y="284" text-anchor="middle">oft 30 kg/m²</text>
<text x="240" y="322" text-anchor="middle" font-size="18" fill="#202022">Werte des Glases, ohne Rahmen</text>
</g>
</svg>
