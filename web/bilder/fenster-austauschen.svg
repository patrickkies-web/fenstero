<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 390" width="480" height="390" role="img" aria-labelledby="t d"><style id="schrift">@font-face{font-family:"Outfit";font-weight:400 699;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Outfit";font-weight:700 900;src:url(data:font/woff2;base64,) format("woff2")}</style>
<title id="t">Fenster austauschen in sechs Schritten</title>
<desc id="d">Zeitstrahl in sechs Schritten: ausmessen und fotografieren, Angebote vergleichen, Förderung beantragen (vor dem Auftrag), beauftragen, Feinaufmaß und Fertigung, Einbau und Abnahme. Die meiste Zeit vergeht vor dem Einbau.</desc>
<rect width="480" height="390" rx="16" fill="#ffffff"/>
<line x1="48" y1="44" x2="48" y2="314" stroke="#ecebec" stroke-width="6"/>
<g font-family="Outfit, Helvetica Neue, Arial, sans-serif" font-size="18">
<circle cx="48" cy="44" r="17" fill="#897efc"/><text x="48" y="50" text-anchor="middle" fill="#07090a" font-weight="700">1</text>
<circle cx="48" cy="98" r="17" fill="#07090a"/><text x="48" y="104" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
<circle cx="48" cy="152" r="17" fill="#f88962"/><text x="48" y="158" text-anchor="middle" fill="#07090a" font-weight="700">3</text>
<circle cx="48" cy="206" r="17" fill="#07090a"/><text x="48" y="212" text-anchor="middle" fill="#ffffff" font-weight="700">4</text>
<circle cx="48" cy="260" r="17" fill="#07090a"/><text x="48" y="266" text-anchor="middle" fill="#ffffff" font-weight="700">5</text>
<circle cx="48" cy="314" r="17" fill="#07090a"/><text x="48" y="320" text-anchor="middle" fill="#ffffff" font-weight="700">6</text>
<g fill="#07090a" font-weight="700">
<text x="80" y="50" fill="#3c3a66">Ausmessen und fotografieren</text>
<text x="80" y="104">Angebote vergleichen</text>
<text x="80" y="158" fill="#b4502f">Förderung beantragen</text>
<text x="80" y="212">Beauftragen</text>
<text x="80" y="266">Feinaufmaß und Fertigung</text>
<text x="80" y="320">Einbau und Abnahme</text>
</g>
<text x="456" y="158" text-anchor="end" fill="#b4502f">vor dem Auftrag</text>
<text x="24" y="370" fill="#07090a">Die meiste Zeit vergeht vor dem Einbau.</text>
</g>
</svg>
