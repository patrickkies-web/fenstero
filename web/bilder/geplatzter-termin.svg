<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 392" width="480" height="392" role="img" aria-labelledby="t d">
<title id="t">Was ein geplatzter Aufmaßtermin kostet, Beispiel</title>
<desc id="d">Balken je Kostenposten bei 25 km Entfernung und 65 Euro Verrechnungssatz: Fahrt 24 Euro, Fahrzeit 76 Euro, Warten und Anrufen 16 Euro, zusammen 116 Euro. Wird die geplante Zeit vor Ort nicht neu belegt, kommen 49 Euro dazu, zusammen 165 Euro.</desc>
<rect width="480" height="392" rx="16" fill="#ffffff"/>
<line x1="200" y1="24" x2="200" y2="306" stroke="#141414" stroke-width="1.5"/>
<g font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#141414">
<path d="M200 30H259a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H200Z" fill="#1d4ed8"/>
<text x="24" y="46" font-weight="700">Fahrt</text>
<text x="24" y="70" fill="#5c5c58">50 km × 0,48 €</text>
<text x="273" y="52" font-weight="700">24 €</text>
<path d="M200 102H396a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H200Z" fill="#1d4ed8"/>
<text x="24" y="118" font-weight="700">Fahrzeit</text>
<text x="24" y="142" fill="#5c5c58">70 Min. × 65 €/h</text>
<text x="410" y="124" font-weight="700">76 €</text>
<path d="M200 174H238a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H200Z" fill="#1d4ed8"/>
<text x="24" y="190" font-weight="700">Warten, Anrufen</text>
<text x="24" y="214" fill="#5c5c58">15 Min. × 65 €/h</text>
<text x="252" y="196" font-weight="700">16 €</text>
<path d="M201 247H325a3 3 0 0 1 3 3v22a3 3 0 0 1-3 3H201Z" fill="#dceaf7" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="24" y="262" font-weight="700">Zeit vor Ort</text>
<text x="24" y="286" fill="#5c5c58">45 Min. Aufmaß</text>
<text x="339" y="268" font-weight="700">49 €</text>
<line x1="24" y1="316" x2="456" y2="316" stroke="#d6d4cc" stroke-width="1.5"/>
<text x="24" y="346" font-weight="700">Zusammen 116 €</text>
<text x="24" y="372">mit der ungenutzten Zeit vor Ort 165 €</text>
</g>
</svg>
