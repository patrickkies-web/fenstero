<text x="140" y="90" text-anchor="end">Breite oben</text><text x="140" y="216" text-anchor="end">Mitte</text><text x="140" y="342" text-anchor="end">unten</text>
<text x="240" y="44" text-anchor="middle">Höhe an 3 Stellen</text>
<text x="342" y="352">Schwelle</text>
<text x="240" y="404" text-anchor="middle" font-weight="700">ab dem fertigen Fußboden</text>
<text x="240" y="428" text-anchor="middle" fill="#202022">Fliesen, Parkett, Teppich</text>
