<title id="t">Balkontür ausmessen: die Messpunkte</title>
<desc id="d">Balkontür von innen: Breite oben, in der Mitte und unten, Höhe links, in der Mitte und rechts, jeweils ab der Oberkante des fertigen Fußbodens bis zum Sturz. Unten die Schwelle.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#f88962"/></marker></defs>
