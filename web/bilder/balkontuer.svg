<g stroke="#f88962" stroke-width="2.5" marker-start="url(#p)" marker-end="url(#p)">
<line x1="152" y1="84" x2="328" y2="84"/><line x1="152" y1="210" x2="328" y2="210"/><line x1="152" y1="336" x2="328" y2="336"/>
<line x1="176" y1="56" x2="176" y2="370"/><line x1="240" y1="56" x2="240" y2="370"/><line x1="304" y1="56" x2="304" y2="370"/>
</g>
