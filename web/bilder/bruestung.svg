<title id="t">Brüstungshöhe und Absturzhöhe am Fenster</title>
<desc id="d">Schnitt durch ein Fenster im Obergeschoss. Die Brüstungshöhe reicht vom fertigen Fußboden bis zur Oberkante der Brüstung, mindestens 80 cm, bei mehr als 12 m Absturzhöhe 90 cm. Die Absturzhöhe reicht vom Fußboden bis zum Gelände draußen.</desc>
