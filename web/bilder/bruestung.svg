<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380" role="img" aria-labelledby="t d">
<title id="t">Brüstungshöhe und Absturzhöhe am Fenster</title>
<desc id="d">Schnitt durch ein Fenster im Obergeschoss. Die Brüstungshöhe reicht vom fertigen Fußboden bis zur Oberkante der Brüstung, mindestens 80 cm, ab 12 m Absturzhöhe 90 cm. Die Absturzhöhe reicht vom Fußboden bis zum Gelände draußen.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#c2410c"/></marker></defs>
<rect width="480" height="380" rx="16" fill="#ffffff"/>
<rect x="16" y="196" width="254" height="14" fill="#a8a79f"/>
<rect x="250" y="24" width="44" height="60" fill="#d6d5cf"/>
<rect x="262" y="84" width="20" height="62" fill="#dceaf7" stroke="#1d4ed8" stroke-width="3"/>
<rect x="250" y="146" width="44" height="220" fill="#d6d5cf"/>
<rect x="236" y="142" width="22" height="6" fill="#a8a79f"/>
<line x1="294" y1="350" x2="464" y2="350" stroke="#141414" stroke-width="3"/>
<line x1="226" y1="194" x2="226" y2="150" stroke="#c2410c" stroke-width="2.5" marker-start="url(#p)" marker-end="url(#p)"/>
<line x1="330" y1="196" x2="330" y2="348" stroke="#141414" stroke-width="1.5" stroke-dasharray="5 4"/>
<g font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#141414">
<text x="24" y="118" font-weight="700">Brüstungshöhe</text>
<text x="24" y="142" fill="#3d3d3a">mind. 80 cm,</text>
<text x="24" y="166" fill="#3d3d3a">über 12 m: 90 cm</text>
<text x="24" y="236">Fußboden</text>
<text x="340" y="276">Absturz-</text><text x="340" y="298">höhe</text>
<text x="300" y="374">Gelände</text>
<text x="24" y="44" fill="#3d3d3a">innen</text><text x="404" y="44" fill="#3d3d3a">außen</text>
</g>
</svg>
