<text x="24" y="142" fill="#202022">mind. 80 cm,</text>
<text x="24" y="166" fill="#202022">über 12 m: 90 cm</text>
<text x="24" y="236">Fußboden</text>
<text x="340" y="276">Absturz-</text><text x="340" y="298">höhe</text>
<text x="300" y="374">Gelände</text>
<text x="24" y="44" fill="#202022">innen</text><text x="404" y="44" fill="#202022">außen</text>
