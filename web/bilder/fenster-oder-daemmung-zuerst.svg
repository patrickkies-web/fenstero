<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-labelledby="t d"><style id="schrift">@font-face{font-family:"Outfit";font-weight:400 699;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Outfit";font-weight:700 900;src:url(data:font/woff2;base64,) format("woff2")}</style>
<title id="t">Fenster oder Fassade zuerst: drei Einbaulagen von oben</title>
<desc id="d">Drei Wandschnitte von oben nebeneinander. Links heute: das alte Fenster sitzt in der Mitte der ungedämmten Wand. In der Mitte Fenster zuerst: das neue Fenster sitzt außen bündig, die Laibung ist vorübergehend gedämmt, die spätere Fassadendämmung ist gestrichelt angedeutet. Rechts zusammen geplant: das Fenster sitzt in der Dämmebene, die Fassadendämmung überdeckt den Rahmen.</desc>
<rect width="480" height="400" rx="16" fill="#ffffff"/>
<g font-family="Outfit, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#07090a">
<text x="24" y="40" font-size="18" font-weight="700">Heute</text>
<text x="176" y="40" font-size="18" font-weight="700">Fenster zuerst</text>
<text x="328" y="40" font-size="18" font-weight="700">Zusammen</text>
<text x="24" y="96" fill="#6b676c">außen</text>
<text x="24" y="296" fill="#6b676c">innen</text>
<!-- 1 Heute: alte Wand, Fenster mittig -->
<rect x="24" y="180" width="40" height="80" fill="#d2d0d3"/>
<rect x="120" y="180" width="40" height="80" fill="#d2d0d3"/>
<rect x="64" y="213" width="96" height="14" fill="none"/>
<rect x="60" y="212" width="8" height="16" fill="#202022"/>
<rect x="116" y="212" width="8" height="16" fill="#202022"/>
<rect x="68" y="216" width="48" height="8" fill="#897efc"/>
<!-- 2 Fenster zuerst: Fenster außen bündig, Laibung vorübergehend gedämmt, spätere Dämmung gestrichelt -->
<rect x="176" y="180" width="40" height="80" fill="#d2d0d3"/>
<rect x="272" y="180" width="40" height="80" fill="#d2d0d3"/>
<rect x="176" y="140" width="136" height="40" fill="none" stroke="#f88962" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="216" y="196" width="8" height="64" fill="#fde3d8" stroke="#f88962" stroke-width="2"/>
<rect x="264" y="196" width="8" height="64" fill="#fde3d8" stroke="#f88962" stroke-width="2"/>
<rect x="212" y="180" width="8" height="16" fill="#202022"/>
<rect x="268" y="180" width="8" height="16" fill="#202022"/>
<rect x="220" y="184" width="48" height="8" fill="#897efc"/>
<!-- 3 Zusammen: Dämmung voll, Fenster in der Dämmebene, Dämmung überdeckt den Rahmen -->
<rect x="328" y="180" width="40" height="80" fill="#d2d0d3"/>
<rect x="424" y="180" width="40" height="80" fill="#d2d0d3"/>
<rect x="328" y="140" width="40" height="40" fill="#fde3d8" stroke="#f88962" stroke-width="2"/>
<rect x="424" y="140" width="40" height="40" fill="#fde3d8" stroke="#f88962" stroke-width="2"/>
<rect x="368" y="140" width="10" height="20" fill="#fde3d8" stroke="#f88962" stroke-width="2"/>
<rect x="414" y="140" width="10" height="20" fill="#fde3d8" stroke="#f88962" stroke-width="2"/>
<rect x="372" y="152" width="8" height="16" fill="#202022"/>
<rect x="412" y="152" width="8" height="16" fill="#202022"/>
<rect x="380" y="156" width="32" height="8" fill="#897efc"/>
<!-- Beschriftung unten -->
<text x="24" y="330">Fenster mittig,</text>
<text x="24" y="352">Wand kalt</text>
<text x="176" y="330">außen bündig,</text>
<text x="176" y="352">Laibung gedämmt</text>
<text x="328" y="330">Fenster in der</text>
<text x="328" y="352">Dämmebene</text>
<text x="328" y="128" font-size="14" fill="#b4502f">Dämmung</text>
<text x="176" y="128" font-size="14" fill="#b4502f">später</text>
</g>
</svg>
