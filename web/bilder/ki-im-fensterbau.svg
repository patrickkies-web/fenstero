<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 392" width="480" height="392" role="img" aria-labelledby="t d"><style id="schrift">@font-face{font-family:"Outfit";font-weight:400 699;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Outfit";font-weight:700 900;src:url(data:font/woff2;base64,) format("woff2")}</style>
<title id="t">KI im Fensterbau: was die KI liest und was gemessen wird</title>
<desc id="d">Links: Aus Fotos innen und außen liest die KI die Einbausituation, etwa Rollladenkasten, Anschlag, Laibung, Fensterbank und Schäden. Rechts: Die Maße nimmt ein Mensch mit dem Zollstock, drei Breiten und drei Höhen; das kleinste Maß zählt. Beides kommt ins Aufmaßblatt, mit Prüfpunkten fürs Feinaufmaß.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#07090a"/></marker></defs>
<rect width="480" height="392" rx="16" fill="#ffffff"/>
<g stroke-width="3">
<rect x="16" y="16" width="216" height="64" rx="10" fill="#ecebec" stroke="#f88962"/>
<rect x="248" y="16" width="216" height="64" rx="10" fill="#ecebec" stroke="#f88962"/>
<rect x="16" y="112" width="216" height="140" rx="10" fill="#eceef1" stroke="#897efc"/>
<rect x="248" y="112" width="216" height="140" rx="10" fill="#eceef1" stroke="#897efc"/>
<rect x="16" y="288" width="448" height="88" rx="10" fill="#f3f3f4" stroke="#202022"/>
</g>
<g stroke="#07090a" stroke-width="2" marker-end="url(#p)">
<line x1="124" y1="81" x2="124" y2="110"/><line x1="356" y1="81" x2="356" y2="110"/>
<line x1="124" y1="253" x2="124" y2="286"/><line x1="356" y1="253" x2="356" y2="286"/>
</g>
<g font-family="Outfit, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#07090a" text-anchor="middle">
<text x="124" y="54" font-size="20" font-weight="700" fill="#b4502f">Fotos innen, außen</text>
<text x="356" y="54" font-size="20" font-weight="700" fill="#b4502f">Zollstock</text>
<text x="124" y="146" font-weight="700" fill="#3c3a66">KI liest</text>
<text x="124" y="176">Rollladenkasten,</text>
<text x="124" y="202">Anschlag, Laibung,</text>
<text x="124" y="228">Fensterbank, Schäden</text>
<text x="356" y="146" font-weight="700" fill="#3c3a66">Mensch misst</text>
<text x="356" y="176">3 Breiten,</text>
<text x="356" y="202">3 Höhen,</text>
<text x="356" y="228">kleinstes Maß zählt</text>
<text x="240" y="324" font-size="20" font-weight="700">Aufmaßblatt</text>
<text x="240" y="354">Befund und Maße, Prüfpunkte fürs Feinaufmaß</text>
</g>
</svg>
