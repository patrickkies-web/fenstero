<title id="t">Fenster-Förderung 2026 (Beispiel): 15 Prozent auf höchstens 30.000 Euro, Uw höchstens 0,95</title>
<desc id="d">Oben eine Reihe aus zwanzig Stäbchen für 30.000 Euro förderfähige Kosten; drei davon, also 15 Prozent, sind hervorgehoben: 4.500 Euro Zuschuss. Darunter eine Skala für den Uw-Wert von 1,6 bis 0,9: Links von 1,3 ist ein neues Fenster nach dem Gesetz nicht erlaubt, zwischen 1,3 und 0,95 erlaubt, aber nicht gefördert, ab 0,95 gefördert.</desc>
