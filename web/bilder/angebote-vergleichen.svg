<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380" role="img" aria-labelledby="t d"><style id="schrift">@font-face{font-family:"Outfit";font-weight:400 699;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Outfit";font-weight:700 900;src:url(data:font/woff2;base64,) format("woff2")}</style>
<title id="t">Zwei Fensterangebote im Vergleich</title>
<desc id="d">Angebot A kostet 6.200 Euro, hat einen Uw-Wert von 1,1, keine beschriebene Montage, keinen Ausbau und kein Beiputzen. Angebot B kostet 7.100 Euro mit Uw 0,9, RAL-Montage, Ausbau und Beiputzen. B ist förderfähig; vergleichbar kostet A ab rund 6.830 Euro, B 6.035 Euro.</desc>
<rect width="480" height="380" rx="16" fill="#ffffff"/>
<g font-family="Outfit, Helvetica Neue, Arial, sans-serif" fill="#07090a">
<text x="240" y="34" text-anchor="middle" font-size="18" font-weight="700">Sechs Fenster, zwei Angebote (Beispiel)</text>
<rect x="24" y="52" width="204" height="236" rx="14" fill="#f3f3f4" stroke="#c4c1c5" stroke-width="2"/><text x="44" y="86" font-size="20" font-weight="700">Angebot A</text><text x="44" y="122" font-size="28" font-weight="800">6.200 €</text><path d="M46 152l12 12M58 152l-12 12" fill="none" stroke="#f88962" stroke-width="3.5" stroke-linecap="round"/><text x="74" y="162" font-size="18" fill="#b4502f">Uw 1,1</text><path d="M46 186l12 12M58 186l-12 12" fill="none" stroke="#f88962" stroke-width="3.5" stroke-linecap="round"/><text x="74" y="196" font-size="18" fill="#b4502f">Montage offen</text><path d="M46 220l12 12M58 220l-12 12" fill="none" stroke="#f88962" stroke-width="3.5" stroke-linecap="round"/><text x="74" y="230" font-size="18" fill="#b4502f">ohne Ausbau</text><path d="M46 254l12 12M58 254l-12 12" fill="none" stroke="#f88962" stroke-width="3.5" stroke-linecap="round"/><text x="74" y="264" font-size="18" fill="#b4502f">ohne Beiputzen</text><rect x="252" y="52" width="204" height="236" rx="14" fill="#f3f3f4" stroke="#c4c1c5" stroke-width="2"/><text x="272" y="86" font-size="20" font-weight="700">Angebot B</text><text x="272" y="122" font-size="28" font-weight="800">7.100 €</text><path d="M272 158l6 6l11 -13" fill="none" stroke="#897efc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="302" y="162" font-size="18" fill="#07090a">Uw 0,9</text><path d="M272 192l6 6l11 -13" fill="none" stroke="#897efc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="302" y="196" font-size="18" fill="#07090a">RAL-Montage</text><path d="M272 226l6 6l11 -13" fill="none" stroke="#897efc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="302" y="230" font-size="18" fill="#07090a">mit Ausbau</text><path d="M272 260l6 6l11 -13" fill="none" stroke="#897efc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="302" y="264" font-size="18" fill="#07090a">mit Beiputzen</text>
<text x="240" y="322" text-anchor="middle" font-size="18" fill="#3c3a66" font-weight="700">B ist förderfähig: 15 % Zuschuss</text>
<text x="240" y="352" text-anchor="middle" font-size="18">Vergleichbar: A ab rund 6.830 €, B 6.035 €</text>
</g>
</svg>
