<title id="t">Alter der Fenster erkennen: Abstandhalter lesen und Feuerzeugtest</title>
<desc id="d">Oben ein Ausschnitt einer Isolierglasscheibe: Auf dem Abstandhalter zwischen den Scheiben stehen Hersteller und Herstellungsdatum. Unten der Feuerzeugtest: Eine Flamme vor Zweifachglas spiegelt sich viermal; ist ein Spiegelbild anders gefärbt, ist es Wärmeschutzglas.</desc>
