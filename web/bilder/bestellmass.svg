<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 350" width="480" height="350" role="img" aria-labelledby="t d"><style id="schrift">@font-face{font-family:"Outfit";font-weight:400 699;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Outfit";font-weight:700 900;src:url(data:font/woff2;base64,) format("woff2")}</style>
<title id="t">Vom Maß der Maueröffnung zum Bestellmaß</title>
<desc id="d">Das neue Fenster (blau) ist kleiner als die Maueröffnung (orange). Rundum bleibt eine Fuge zum Abdichten. Bestellmaß gleich Öffnung minus zweimal die Fuge.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#07090a"/></marker></defs>
<rect width="480" height="350" rx="16" fill="#ffffff"/>
<rect x="24" y="24" width="432" height="250" fill="#ecebec"/>
<rect x="96" y="62" width="260" height="186" fill="#ffffff" stroke="#f88962" stroke-width="3"/>
<rect x="114" y="80" width="224" height="150" fill="#eceef1" stroke="#897efc" stroke-width="3"/>
<g stroke="#07090a" stroke-width="1.5" marker-start="url(#p)" marker-end="url(#p)">
<line x1="97" y1="155" x2="113" y2="155"/><line x1="339" y1="155" x2="355" y2="155"/><line x1="226" y1="63" x2="226" y2="79"/><line x1="226" y1="231" x2="226" y2="247"/>
</g>
<g font-family="Outfit, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#07090a">
<text x="96" y="52" fill="#b4502f" font-weight="700">Maueröffnung</text>
<text x="226" y="150" text-anchor="middle" fill="#3c3a66" font-weight="700">neues Fenster</text>
<text x="226" y="174" text-anchor="middle" fill="#3c3a66">Bestellmaß</text>
<text x="366" y="150">Fuge</text><text x="366" y="172">je Seite</text>
<text x="240" y="306" text-anchor="middle" font-weight="700">Breite: Öffnung − 2 × Fuge</text>
<text x="240" y="332" text-anchor="middle">Höhe: Öffnung − 2 × Fuge</text>
</g>
</svg>
