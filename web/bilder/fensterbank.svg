<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="t d">
<title id="t">Fensterbank innen und außen im Schnitt</title>
<desc id="d">Schnitt durch die Wand unter dem Fenster. Innen liegt die Fensterbank waagerecht und steht etwas über die Wand. Außen fällt die Fensterbank mit mindestens 5 Grad nach außen, ihre Tropfkante steht mindestens 40 mm vor dem fertigen Putz.</desc>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#141414"/></marker></defs>
