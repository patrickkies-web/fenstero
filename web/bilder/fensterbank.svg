<text x="36" y="60" font-weight="700">innen</text>
<text x="444" y="60" text-anchor="end" font-weight="700">außen</text>
<text x="238" y="28" text-anchor="middle" fill="#3c3a66" font-weight="700">Fenster</text>
<text x="36" y="132">Fensterbank</text>
<text x="36" y="156">innen, waagerecht</text>
<text x="290" y="110">Fensterbank</text>
<text x="290" y="134">außen, Gefälle</text>
<text x="290" y="158">mind. 5°</text>
<text x="112" y="242" text-anchor="middle">Überstand</text>
<text x="340" y="242">mind.</text>
<text x="340" y="264">40 mm</text>
<text x="245" y="290" text-anchor="middle">Wand</text>
<text x="245" y="314" text-anchor="middle">fertig verputzt</text>
