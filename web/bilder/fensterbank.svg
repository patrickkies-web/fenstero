<rect x="212" y="40" width="52" height="132" fill="#ffffff" stroke="#897efc" stroke-width="3"/>
<rect x="232" y="40" width="12" height="122" fill="#eceef1" stroke="#897efc" stroke-width="2"/>
<path d="M98 172H212V186H98Z" fill="#d2d0d3" stroke="#07090a" stroke-width="2"/>
