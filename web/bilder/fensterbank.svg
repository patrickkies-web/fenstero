<line x1="330" y1="186" x2="330" y2="336" stroke="#141414" stroke-width="2"/>
<rect x="212" y="40" width="52" height="132" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
<rect x="232" y="40" width="12" height="122" fill="#dceaf7" stroke="#1d4ed8" stroke-width="2"/>
<path d="M98 172H212V186H98Z" fill="#cfcdc4" stroke="#141414" stroke-width="2"/>
<path d="M264 172L384 182.5V194H378V189.5L264 180Z" fill="#cfcdc4" stroke="#141414" stroke-width="2" stroke-linejoin="round"/>
<g stroke="#141414" stroke-width="1.5" marker-start="url(#p)" marker-end="url(#p)">
<line x1="331" y1="214" x2="383" y2="214"/>
<line x1="99" y1="214" x2="159" y2="214"/>
</g>
<line x1="264" y1="172" x2="344" y2="172" stroke="#141414" stroke-width="1" stroke-dasharray="4 4"/>
<g font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#141414">
<text x="36" y="60" font-weight="700">innen</text>
<text x="444" y="60" text-anchor="end" font-weight="700">außen</text>
<text x="238" y="28" text-anchor="middle" fill="#1d4ed8" font-weight="700">Fenster</text>
<text x="36" y="132">Fensterbank</text>
<text x="36" y="156">innen, waagerecht</text>
<text x="290" y="110">Fensterbank</text>
<text x="290" y="134">außen, Gefälle</text>
<text x="290" y="158">mind. 5°</text>
<text x="112" y="242" text-anchor="middle">Überstand</text>
<text x="340" y="242">mind.</text>
<text x="340" y="264">40 mm</text>
<text x="245" y="290" text-anchor="middle">Wand</text>
<text x="245" y="314" text-anchor="middle">fertig verputzt</text>
</g>
</svg>
