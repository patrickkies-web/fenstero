<text x="86" y="46" font-size="20" font-weight="700">innen</text>
<text x="86" y="276" font-weight="700" fill="#b4502f">Luft zu</text>
<text x="86" y="300" font-weight="700" fill="#b4502f">feucht</text>
<text x="240" y="46" font-size="20" font-weight="700">zwischen</text>
<text x="240" y="276" font-weight="700" fill="#b4502f">Randverbund</text>
<text x="240" y="300" font-weight="700" fill="#b4502f">undicht</text>
<text x="394" y="46" font-size="20" font-weight="700">außen</text>
<text x="394" y="276" font-weight="700" fill="#3c3a66">gutes Glas,</text>
<text x="394" y="300" font-weight="700" fill="#3c3a66">kein Mangel</text>
<text x="240" y="340">links der Raum, rechts draußen</text>
