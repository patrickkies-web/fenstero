<title id="t">Fenster beschlagen: innen, zwischen den Scheiben oder außen</title>
<desc id="d">Drei Schnitte durch eine Isolierscheibe, links jeweils der Raum, rechts draußen. Tropfen auf der Raumseite bedeuten zu feuchte Luft, Tropfen zwischen den Scheiben einen undichten Randverbund, Tropfen außen gut dämmendes Glas.</desc>
